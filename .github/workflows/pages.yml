# Builds the site and publishes it to GitHub Pages on every push to main.
# Enable once in the repo: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A project site is served under /<repo>/; a user site (<user>.github.io) from /.
      - name: Pick the base path
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then echo "VITE_BASE=/" >> "$GITHUB_ENV";
          else echo "VITE_BASE=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"; fi
      - run: npm run build
      # React Router uses real paths; Pages serves 404.html for unknown ones.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
